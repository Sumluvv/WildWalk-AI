version: "3.9"
services:
  wildwalk-ai:
    build: .
    container_name: wildwalk-ai
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./.data:/app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
